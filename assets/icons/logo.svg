<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Złoty metaliczny gradient zewnętrzny -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA8"/>
      <stop offset="20%" stop-color="#E5AF37"/>
      <stop offset="45%" stop-color="#CA8A1A"/>
      <stop offset="70%" stop-color="#FBE292"/>
      <stop offset="90%" stop-color="#B37812"/>
      <stop offset="100%" stop-color="#7B4F04"/>
    </linearGradient>

    <!-- Promienisty gradient tła wewnętrznego tarczy -->
    <radialGradient id="goldDisc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF2BF"/>
      <stop offset="40%" stop-color="#F5C452"/>
      <stop offset="75%" stop-color="#D99419"/>
      <stop offset="100%" stop-color="#9C6207"/>
    </radialGradient>

    <!-- Gradient tła pierścienia napisowego -->
    <linearGradient id="ringNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3654"/>
      <stop offset="100%" stop-color="#0E1D30"/>
    </linearGradient>

    <!-- Cień 3D godła -->
    <filter id="sealShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4A2F02" flood-opacity="0.35"/>
    </filter>

    <!-- Ścieżki dla tekstów zakrzywionych po okręgu -->
    <path id="pathTextTop" d="M 28,120 A 92,92 0 1,1 212,120" fill="none"/>
    <path id="pathTextBottom" d="M 212,120 A 92,92 0 0,1 28,120" fill="none"/>
  </defs>

  <!-- Zewnętrzne złote obramowanie z cieniem -->
  <circle cx="120" cy="120" r="115" fill="url(#goldRim)" filter="url(#sealShadow)"/>
  
  <!-- Pierścień wewnętrzny z ząbkami / perełkami jubilerskimi -->
  <circle cx="120" cy="120" r="110" fill="none" stroke="#FFEAA8" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="120" cy="120" r="106" fill="url(#ringNavy)" stroke="url(#goldRim)" stroke-width="2.5"/>

  <!-- Tekst górny: SZKOŁY SPOŁECZNE W CHEŁMIE -->
  <text font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="12" font-weight="900" fill="#FFEAA8" letter-spacing="2">
    <textPath href="#pathTextTop" startOffset="50%" text-anchor="middle">
      SZKOŁY SPOŁECZNE W CHEŁMIE
    </textPath>
  </text>

  <!-- Tekst dolny: SAPERE AUDE • 1992 -->
  <text font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="11" font-weight="800" fill="#FFEAA8" letter-spacing="2.5">
    <textPath href="#pathTextBottom" startOffset="50%" text-anchor="middle">
      SAPERE AUDE • 1992
    </textPath>
  </text>

  <!-- Gwiazdki po bokach -->
  <g fill="url(#goldRim)">
    <polygon points="32,120 35,114 41,117 37,121 40,126 34,123 29,125 31,120" />
    <polygon points="208,120 205,114 199,117 203,121 200,126 206,123 211,125 209,120" />
  </g>

  <!-- Wewnętrzne pole tarczy herbowej (złocisty dysk z promieniami) -->
  <circle cx="120" cy="120" r="80" fill="url(#goldDisc)" stroke="url(#goldRim)" stroke-width="3"/>
  
  <!-- Poziome pasy w tle herbu ze zdjęcia nr 2 -->
  <g stroke="#9E6707" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="56" y1="80" x2="184" y2="80"/>
    <line x1="48" y1="96" x2="192" y2="96"/>
    <line x1="44" y1="112" x2="196" y2="112"/>
    <line x1="44" y1="128" x2="196" y2="128"/>
    <line x1="48" y1="144" x2="192" y2="144"/>
    <line x1="56" y1="160" x2="184" y2="160"/>
  </g>

  <!-- Drzewo Wiedzy i Mądrości z herbu ze zdjęcia 2 -->
  <g id="treeSymbol">
    <!-- Pnie drzew -->
    <path d="M102,168 C102,148 106,134 98,114 C106,120 112,124 116,130 C114,148 115,160 115,168 Z" fill="#4E3101" stroke="#FFEAA8" stroke-width="0.8"/>
    <path d="M128,168 C128,148 124,132 134,112 C130,120 126,124 122,132 C124,148 125,160 125,168 Z" fill="#4E3101" stroke="#FFEAA8" stroke-width="0.8"/>
    
    <!-- Korona drzewa (bogata forma w kolorze brązu i złota) -->
    <path d="M72,110 C70,92 84,76 102,78 C110,68 128,66 138,76 C150,68 168,74 172,90 C182,96 182,116 170,124 C162,132 144,128 138,122 C126,132 106,132 98,122 C84,126 72,122 72,110 Z" 
          fill="#6F4603" stroke="#FFEAA8" stroke-width="1.2"/>
    
    <!-- Akcenty świetlne na liściach -->
    <circle cx="106" cy="92" r="9" fill="#FFF2BF" opacity="0.8"/>
    <circle cx="132" cy="88" r="11" fill="#FFF2BF" opacity="0.8"/>
    <circle cx="154" cy="100" r="8" fill="#FFF2BF" opacity="0.8"/>
    <circle cx="88" cy="104" r="7" fill="#FFF2BF" opacity="0.8"/>
  </g>

  <!-- Wstęga z dewizą na dole herbu -->
  <g filter="url(#sealShadow)">
    <path d="M 54,162 Q 120,176 186,162 L 180,180 Q 120,194 60,180 Z" fill="#0E1D30" stroke="url(#goldRim)" stroke-width="2"/>
    <text x="120" y="176" font-family="'Cinzel', serif" font-size="10" font-weight="900" fill="#FFEAA8" text-anchor="middle" letter-spacing="2">
      SAPERE AUDE
    </text>
  </g>
</svg>
