name: Oracle VPS Auto-Sync Gallery

on:
  schedule:
    # Co godzinę synchronizuje galerie ze Strapi na VPS do statycznego jsona dla GitHub Pages
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Data from Oracle Strapi
        id: fetch-data
        run: |
          echo "Pobieranie najnowszych galerii z Oracle Cloud VPS..."
          HTTP_CODE=$(curl -g -s -o /tmp/latest_galerie.json -w "%{http_code}" --max-time 45 "https://spolecznachelm.duckdns.org/api/galerias?populate=*&pagination[pageSize]=100&sort=Data:desc,createdAt:desc")
          echo "HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/latest_galerie.json ]; then
            DATA_COUNT=$(jq '.data | length' /tmp/latest_galerie.json 2>/dev/null || echo 0)
            echo "Pobrano $DATA_COUNT galerii."
            if [ "$DATA_COUNT" -gt 0 ]; then
              cp /tmp/latest_galerie.json data/galerie.json
              echo "has_data=true" >> $GITHUB_OUTPUT
            fi
          fi

          echo "Pobieranie najnowszych wydań gazetki z Oracle Cloud VPS..."
          G_HTTP_CODE=$(curl -g -s -o /tmp/latest_gazetka.json -w "%{http_code}" --max-time 30 "https://spolecznachelm.duckdns.org/api/gazetkas?populate=*&pagination[pageSize]=100&sort=Data:desc,createdAt:desc")
          echo "Gazetka HTTP Code: $G_HTTP_CODE"
          if [ "$G_HTTP_CODE" -eq 200 ] && [ -s /tmp/latest_gazetka.json ]; then
            cp /tmp/latest_gazetka.json data/gazetka.json
            echo "has_data=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push if data changed
        if: steps.fetch-data.outputs.has_data == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "Wykryto zmiany w danych ze Strapi - zapisywanie na GitHub Pages..."
            git add data/
            git commit -m "Auto-sync danych ze Strapi Cloud [skip ci]"
            git push
          else
            echo "Brak zmian w danych - pliki są w 100% aktualne."
          fi
