name: Render Cloud Auto-Sync & Keep-Alive

on:
  schedule:
    # Co 10 minut pinguje Render (nigdy nie zasypia) i automatycznie synchronizuje galerie/aktualnosci na GitHub Pages
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Data from Render Strapi
        id: fetch-data
        run: |
          echo "Pobieranie najnowszych galerii ze Strapi na Render..."
          HTTP_CODE=$(curl -g -s -o /tmp/latest_galerie.json -w "%{http_code}" --max-time 45 "https://spoleczna-strapi.onrender.com/api/galerias?populate=*&pagination[pageSize]=100&sort=Data:desc,createdAt:desc")
          echo "Galerie HTTP Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ] && [ -s /tmp/latest_galerie.json ]; then
            DATA_COUNT=$(jq '.data | length' /tmp/latest_galerie.json 2>/dev/null || echo 0)
            echo "Pobrano $DATA_COUNT galerii."
            if [ "$DATA_COUNT" -gt 0 ]; then
              cp /tmp/latest_galerie.json data/galerie.json
              echo "has_data=true" >> $GITHUB_OUTPUT
            fi
          fi

          echo "Pobieranie najnowszych aktualności ze Strapi..."
          A_HTTP_CODE=$(curl -g -s -o /tmp/latest_aktualnosci.json -w "%{http_code}" --max-time 30 "https://spoleczna-strapi.onrender.com/api/aktualnoscs?populate=*&pagination[pageSize]=100&sort=Data:desc,createdAt:desc")
          echo "Aktualnosci HTTP Code: $A_HTTP_CODE"
          if [ "$A_HTTP_CODE" -eq 200 ] && [ -s /tmp/latest_aktualnosci.json ]; then
            A_COUNT=$(jq '.data | length' /tmp/latest_aktualnosci.json 2>/dev/null || echo 0)
            if [ "$A_COUNT" -gt 0 ]; then
              cp /tmp/latest_aktualnosci.json data/aktualnosci.json
              echo "has_data=true" >> $GITHUB_OUTPUT
            fi
          fi

          echo "Pobieranie najnowszych wydań gazetki ze Strapi..."
          G_HTTP_CODE=$(curl -g -s -o /tmp/latest_gazetka.json -w "%{http_code}" --max-time 30 "https://spoleczna-strapi.onrender.com/api/gazetkas?populate=*&pagination[pageSize]=100&sort=Data:desc,createdAt:desc")
          echo "Gazetka HTTP Code: $G_HTTP_CODE"
          if [ "$G_HTTP_CODE" -eq 200 ] && [ -s /tmp/latest_gazetka.json ]; then
            G_COUNT=$(jq '.data | length' /tmp/latest_gazetka.json 2>/dev/null || echo 0)
            if [ "$G_COUNT" -gt 0 ]; then
              cp /tmp/latest_gazetka.json data/gazetka.json
              echo "has_data=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit & Push if data changed
        if: steps.fetch-data.outputs.has_data == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "Wykryto zmiany w danych ze Strapi - zapisywanie na GitHub Pages..."
            git add data/
            git commit -m "Auto-sync danych ze Strapi Cloud [skip ci]"
            git push
          else
            echo "Brak zmian w danych - pliki są w 100% aktualne."
          fi
