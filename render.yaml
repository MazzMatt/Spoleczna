services:
  - type: web
    name: spoleczna-strapi
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=300
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: IS_PROXIED
        value: "true"
      - key: CLOUDINARY_NAME
        value: zpylz0ih
      - key: CLOUDINARY_KEY
        value: "286117754568249"
